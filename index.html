<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portal</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #07100d;
  --panel: #0c1713;
  --panel2: #101e19;
  --border: #1b332a;
  --green: #20d879;
  --text: #f2f7f4;
  --muted: #82958c;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 20%, #12372a 0%, transparent 35%),
    linear-gradient(135deg, #050a08, #0a1510 55%, #050806);
  color: var(--text);
  font-family: Arial, sans-serif;
}

/* TOP BAR */
.topbar {
  height: 58px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(5,10,8,.9);
}

.logo {
  color: var(--green);
  font-size: 20px;
  font-weight: bold;
  white-space: nowrap;
}

.menu {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  color: white;
  font-size: 22px;
}

.top-search {
  flex: 1;
  max-width: 700px;
  margin: auto;
}

.top-search input {
  width: 100%;
  padding: 12px 18px;
  border-radius: 12px;
  border: 1px solid var(--border);
  outline: none;
  background: #0d1a15;
  color: white;
  font-size: 15px;
}

.top-search input:focus {
  border-color: var(--green);
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  left: 0;
  top: 58px;
  bottom: 0;
  width: 210px;
  padding: 18px 12px;
  background: #07100d;
  border-right: 1px solid var(--border);
  transition: .25s;
}

.sidebar.closed {
  transform: translateX(-100%);
}

.nav-button {
  width: 100%;
  padding: 13px;
  margin-bottom: 7px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #a8b8b0;
  text-align: left;
  font-size: 14px;
  cursor: pointer;
}

.nav-button:hover,
.nav-button.active {
  background: #10231a;
  color: var(--green);
}

/* MAIN */
main {
  margin-left: 210px;
  padding: 45px 25px;
  transition: .25s;
}

main.full {
  margin-left: 0;
}

.hero {
  max-width: 850px;
  margin: 0 auto;
  text-align: center;
}

.hero-logo {
  font-size: 38px;
  font-weight: bold;
  color: var(--green);
  margin-bottom: 10px;
}

.subtitle {
  color: var(--muted);
  margin-bottom: 25px;
}

/* SEARCH */
.search-box {
  display: flex;
  gap: 8px;
  max-width: 700px;
  margin: auto;
}

.search-box input {
  flex: 1;
  min-width: 0;
  padding: 16px 18px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #0d1a15;
  color: white;
  font-size: 16px;
  outline: none;
}

.search-box input:focus {
  border-color: var(--green);
}

.search-box button {
  border: 0;
  border-radius: 14px;
  padding: 0 20px;
  background: var(--green);
  color: #041008;
  font-weight: bold;
  cursor: pointer;
}

/* CARDS */
.section {
  max-width: 900px;
  margin: 45px auto 0;
}

.section h2 {
  font-size: 18px;
  margin-bottom: 16px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 13px;
}

.card {
  min-height: 120px;
  padding: 20px 12px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: rgba(12,23,19,.9);
  color: white;
  text-align: center;
  cursor: pointer;
  transition: .2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: var(--green);
  background: #10251b;
}

.icon {
  font-size: 32px;
  margin-bottom: 12px;
}

.card span {
  color: #c7d2cd;
  font-size: 14px;
}

/* PAGES */
.page {
  display: none;
  max-width: 900px;
  margin: auto;
}

.page.active {
  display: block;
}

.panel {
  background: #0c1713;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 20px;
}

.history-item {
  padding: 14px 5px;
  border-bottom: 1px solid var(--border);
  color: #aebcb5;
}

/* MOBILE */
@media(max-width:700px) {
  .sidebar {
    width: 180px;
  }

  main {
    margin-left: 0;
    padding: 30px 15px;
  }

  .hero-logo {
    font-size: 30px;
  }

  .search-box {
    flex-direction: column;
  }

  .search-box button {
    min-height: 48px;
  }

  .cards {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header class="topbar">
  <button class="menu" onclick="toggleMenu()">☰</button>

  <div class="logo">My Portal</div>

  <div class="top-search">
    <input
      id="topSearch"
      placeholder="Search the web..."
      onkeydown="if(event.key==='Enter') searchWeb(this.value)"
    >
  </div>
</header>

<aside class="sidebar" id="sidebar">

  <button class="nav-button active" onclick="showPage('home', this)">
    🏠 Home
  </button>

  <button class="nav-button" onclick="showPage('apps', this)">
    ◈ Apps
  </button>

  <button class="nav-button" onclick="showPage('history', this)">
    ◷ History
  </button>

  <button class="nav-button" onclick="showPage('settings', this)">
    ⚙ Settings
  </button>

</aside>

<main id="main">

  <!-- HOME -->
  <section class="page active" id="home">

    <div class="hero">

      <div class="hero-logo">My Portal</div>

      <div class="subtitle">
        Search the web and open your favorite sites
      </div>

      <form class="search-box" onsubmit="searchWeb(document.getElementById('search').value); return false;">
        <input
          id="search"
          placeholder="Search or enter a website..."
          autocomplete="off"
        >
        <button type="submit">Search</button>
      </form>

    </div>

    <div class="section">

      <h2>Quick Links</h2>

      <div class="cards">

        <div class="card" onclick="openSite('https://www.google.com')">
          <div class="icon">🔎</div>
          <span>Google</span>
        </div>

        <div class="card" onclick="openSite('https://www.youtube.com')">
          <div class="icon">▶️</div>
          <span>YouTube</span>
        </div>

        <div class="card" onclick="openSite('https://www.reddit.com')">
          <div class="icon">🟠</div>
          <span>Reddit</span>
        </div>

        <div class="card" onclick="openSite('https://github.com')">
          <div class="icon">◉</div>
          <span>GitHub</span>
        </div>

        <div class="card" onclick="openSite('https://wikipedia.org')">
          <div class="icon">W</div>
          <span>Wikipedia</span>
        </div>

        <div class="card" onclick="openSite('https://discord.com')">
          <div class="icon">💬</div>
          <span>Discord</span>
        </div>

      </div>

    </div>

  </section>

  <!-- APPS -->
  <section class="page" id="apps">

    <h2>Apps</h2>

    <div class="cards">

      <div class="card" onclick="openSite('https://www.google.com')">
        <div class="icon">🔎</div>
        <span>Google</span>
      </div>

      <div class="card" onclick="openSite('https://www.youtube.com')">
        <div class="icon">▶️</div>
        <span>YouTube</span>
      </div>

      <div class="card" onclick="openSite('https://github.com')">
        <div class="icon">◉</div>
        <span>GitHub</span>
      </div>

      <div class="card" onclick="openSite('https://wikipedia.org')">
        <div class="icon">W</div>
        <span>Wikipedia</span>
      </div>

    </div>

  </section>

  <!-- HISTORY -->
  <section class="page" id="history">

    <h2>History</h2>

    <div class="panel" id="historyList">
      <div class="history-item">No searches yet.</div>
    </div>

  </section>

  <!-- SETTINGS -->
  <section class="page" id="settings">

    <h2>Settings</h2>

    <div class="panel">

      <p>Search engine</p>

      <select id="engine">
        <option value="https://www.google.com/search?q=">Google</option>
        <option value="https://www.bing.com/search?q=">Bing</option>
        <option value="https://search.brave.com/search?q=">Brave Search</option>
      </select>

      <br><br>

      <button onclick="clearHistory()">
        Clear search history
      </button>

    </div>

  </section>

</main>

<script>

let historyData = [];

function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("closed");
}

function showPage(id, button) {

  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav-button").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");
}

function searchWeb(value) {

  value = value.trim();

  if (!value) return;

  historyData.unshift(value);

  updateHistory();

  const engine =
    document.getElementById("engine")?.value ||
    "https://www.google.com/search?q=";

  window.open(
    engine + encodeURIComponent(value),
    "_blank"
  );
}

function openSite(url) {

  historyData.unshift(url);
  updateHistory();

  window.open(url, "_blank");
}

function updateHistory() {

  const box = document.getElementById("historyList");

  if (!historyData.length) {
    box.innerHTML =
      '<div class="history-item">No searches yet.</div>';
    return;
  }

  box.innerHTML = historyData
    .slice(0, 20)
    .map(item =>
      `<div class="history-item">${escapeHtml(item)}</div>`
    )
    .join("");
}

function clearHistory() {
  historyData = [];
  updateHistory();
}

function escapeHtml(text) {

  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

</script>

</body>
    </html>
