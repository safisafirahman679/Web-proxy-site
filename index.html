<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Search Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
    }

    .container {
      width: 92%;
      max-width: 800px;
      margin: auto;
      padding: 40px 0;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      opacity: .8;
      margin-bottom: 25px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 15px 22px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    #results {
      margin-top: 25px;
    }

    .result {
      background: rgba(255,255,255,.12);
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 12px;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .result a {
      color: white;
      text-decoration: none;
    }

    .result p {
      opacity: .85;
      line-height: 1.5;
    }

    .status {
      text-align: center;
      margin-top: 25px;
      opacity: .8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌐 My Search</h1>

    <div class="subtitle">
      Search and view results on this page
    </div>

    <form id="searchForm" class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="Search for something..."
        autocomplete="off"
        required
      >

      <button type="submit">Search</button>
    </form>

    <div id="status" class="status"></div>

    <div id="results"></div>

  </div>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const query = input.value.trim();

      if (!query) return;

      results.innerHTML = "";
      status.textContent = "Searching...";

      try {
        const url =
          "https://en.wikipedia.org/w/api.php" +
          "?action=query" +
          "&list=search" +
          "&srsearch=" + encodeURIComponent(query) +
          "&srlimit=10" +
          "&format=json" +
          "&origin=*";

        const response = await fetch(url);
        const data = await response.json();

        const items = data.query.search;

        status.textContent =
          items.length + " result(s) found";

        if (items.length === 0) {
          results.innerHTML =
            "<div class='result'>No results found.</div>";
          return;
        }

        items.forEach(item => {

          const title = document.createElement("h2");
          title.textContent = item.title;

          const description = document.createElement("p");
          description.innerHTML =
            item.snippet + "...";

          const link = document.createElement("a");
          link.href =
            "https://en.wikipedia.org/wiki/" +
            encodeURIComponent(item.title.replace(/ /g, "_"));

          link.target = "_blank";
          link.textContent = "Read article";

          const box = document.createElement("div");
          box.className = "result";

          box.appendChild(title);
          box.appendChild(description);
          box.appendChild(link);

          results.appendChild(box);
        });

      } catch (error) {

        status.textContent = "";

        results.innerHTML =
          "<div class='result'>" +
          "Sorry, the search could not be completed." +
          "</div>";
      }
    });
  </script>

</body>
                                      </html>
