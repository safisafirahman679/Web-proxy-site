<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Portal</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #080b10;
  color: white;
  min-height: 100vh;
}

header {
  height: 70px;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 12px 18px;
  background: #10151d;
  border-bottom: 1px solid #252c36;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  white-space: nowrap;
}

.search {
  display: flex;
  flex: 1;
  max-width: 850px;
  margin: auto;
}

.search select {
  background: #171d26;
  color: white;
  border: 1px solid #303946;
  padding: 0 12px;
  border-radius: 10px 0 0 10px;
}

.search input {
  flex: 1;
  padding: 13px;
  border: 1px solid #303946;
  border-left: 0;
  background: #0d1219;
  color: white;
  outline: none;
}

.search button {
  padding: 0 18px;
  border: 0;
  background: #3b82f6;
  color: white;
  font-weight: bold;
  border-radius: 0 10px 10px 0;
  cursor: pointer;
}

.search button:hover {
  background: #2563eb;
}

.layout {
  display: grid;
  grid-template-columns: 230px 1fr;
  min-height: calc(100vh - 70px);
}

aside {
  background: #0d1219;
  border-right: 1px solid #252c36;
  padding: 20px;
}

aside h3 {
  color: #8d98a8;
  font-size: 13px;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.nav {
  display: block;
  width: 100%;
  padding: 12px;
  margin-bottom: 7px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: #dce3ec;
  text-align: left;
  cursor: pointer;
}

.nav:hover {
  background: #19212c;
}

main {
  padding: 25px;
  overflow: hidden;
}

.hero {
  text-align: center;
  padding: 35px 15px;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 50px);
  margin-bottom: 10px;
}

.hero p {
  color: #929dab;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  max-width: 1000px;
  margin: auto;
}

.card {
  background: #111720;
  border: 1px solid #252e3a;
  border-radius: 15px;
  padding: 20px;
  cursor: pointer;
  transition: .2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #3b82f6;
}

.card-icon {
  font-size: 30px;
  margin-bottom: 12px;
}

.card h3 {
  margin-bottom: 6px;
}

.card p {
  color: #8d98a8;
  font-size: 14px;
}

#results {
  max-width: 1000px;
  margin: 20px auto;
}

.result {
  background: #111720;
  border: 1px solid #252e3a;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.result h3 {
  color: #60a5fa;
  margin-bottom: 7px;
}

.result p {
  color: #aab4c1;
  line-height: 1.5;
}

.result button {
  margin-top: 12px;
  padding: 8px 13px;
  border: 0;
  border-radius: 7px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

.viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: #070a0e;
  z-index: 100;
  flex-direction: column;
}

.viewer-bar {
  height: 58px;
  background: #111720;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
}

.viewer-bar button {
  border: 0;
  background: #202936;
  color: white;
  padding: 9px 12px;
  border-radius: 7px;
  cursor: pointer;
}

.viewer-url {
  flex: 1;
  background: #080c12;
  color: #aeb8c6;
  padding: 9px;
  border-radius: 7px;
  overflow: hidden;
  white-space: nowrap;
}

iframe {
  flex: 1;
  width: 100%;
  border: 0;
  background: white;
}

.empty {
  text-align: center;
  color: #7f8997;
  padding: 25px;
}

@media (max-width: 700px) {
  header {
    height: auto;
    flex-wrap: wrap;
  }

  .logo {
    width: 100%;
  }

  .search {
    width: 100%;
  }

  .layout {
    display: block;
  }

  aside {
    display: none;
  }

  main {
    padding: 15px;
  }

  .search select {
    max-width: 110px;
  }

  .search button {
    padding: 0 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🌐 Web Portal</div>

  <form class="search" id="searchForm">
    <select id="engine">
      <option value="duck">DuckDuckGo</option>
      <option value="wiki">Wikipedia</option>
    </select>

    <input
      id="searchInput"
      type="search"
      placeholder="Search DuckDuckGo..."
      autocomplete="off"
    >

    <button type="submit">Search</button>
  </form>
</header>

<div class="layout">

<aside>
  <h3>Navigation</h3>

  <button class="nav" onclick="home()">🏠 Home</button>
  <button class="nav" onclick="showHistory()">🕘 History</button>
  <button class="nav" onclick="showFavorites()">⭐ Favorites</button>
  <button class="nav" onclick="clearData()">🗑 Clear Data</button>
</aside>

<main>

<section class="hero">
  <h1>Search the Web</h1>
  <p>Choose DuckDuckGo or Wikipedia above.</p>
</section>

<div class="cards">

  <div class="card" onclick="searchEngine('duck')">
    <div class="card-icon">🦆</div>
    <h3>DuckDuckGo</h3>
    <p>Search the web with DuckDuckGo.</p>
  </div>

  <div class="card" onclick="searchEngine('wiki')">
    <div class="card-icon">📚</div>
    <h3>Wikipedia</h3>
    <p>Search Wikipedia articles.</p>
  </div>

  <div class="card" onclick="openViewer('https://github.com')">
    <div class="card-icon">💻</div>
    <h3>GitHub</h3>
    <p>Open GitHub when embedding is allowed.</p>
  </div>

  <div class="card" onclick="openViewer('https://www.youtube.com')">
    <div class="card-icon">▶️</div>
    <h3>YouTube</h3>
    <p>Open YouTube when embedding is allowed.</p>
  </div>

</div>

<div id="results"></div>

</main>
</div>

<!-- WEBSITE VIEWER -->

<div class="viewer" id="viewer">

  <div class="viewer-bar">

    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <button onclick="reloadViewer()">⟳</button>
    <button onclick="closeViewer()">✕</button>

    <div class="viewer-url" id="viewerUrl">
      Ready
    </div>

  </div>

  <iframe
    id="viewerFrame"
    title="Website Viewer"
    sandbox="allow-forms allow-modals allow-popups allow-scripts allow-same-origin">
  </iframe>

</div>

<script>

const searchForm = document.getElementById("searchForm");
const searchInput = document.getElementById("searchInput");
const engine = document.getElementById("engine");
const results = document.getElementById("results");

const viewer = document.getElementById("viewer");
const viewerFrame = document.getElementById("viewerFrame");
const viewerUrl = document.getElementById("viewerUrl");

let historyData =
  JSON.parse(localStorage.getItem("webHistory") || "[]");

let favorites =
  JSON.parse(localStorage.getItem("webFavorites") || "[]");


/* SEARCH */

searchForm.addEventListener("submit", function(e) {

  e.preventDefault();

  const query = searchInput.value.trim();

  if (!query) return;

  if (engine.value === "duck") {
    searchDuckDuckGo(query);
  } else {
    searchWikipedia(query);
  }

});


/* DUCKDUCKGO */

function searchDuckDuckGo(query) {

  saveHistory("DuckDuckGo: " + query);

  /*
    DuckDuckGo does not provide a normal browser-search
    API that lets a static GitHub Pages site reproduce
    its full results page.

    So this opens the normal DuckDuckGo search page.
  */

  const url =
    "https://duckduckgo.com/?q=" +
    encodeURIComponent(query);

  openViewer(url);
}


/* WIKIPEDIA */

async function searchWikipedia(query) {

  results.innerHTML =
    '<div class="empty">Searching Wikipedia...</div>';

  saveHistory("Wikipedia: " + query);

  try {

    const api =
      "https://en.wikipedia.org/w/api.php" +
      "?action=query" +
      "&format=json" +
      "&origin=*" +
      "&list=search" +
      "&srlimit=10" +
      "&srsearch=" +
      encodeURIComponent(query);

    const response = await fetch(api);
    const data = await response.json();

    results.innerHTML = "";

    if (!data.query.search.length) {

      results.innerHTML =
        '<div class="empty">No results found.</div>';

      return;
    }

    data.query.search.forEach(item => {

      const title = item.title;

      const url =
        "https://en.wikipedia.org/wiki/" +
        encodeURIComponent(title.replaceAll(" ", "_"));

      const div = document.createElement("div");

      div.className = "result";

      div.innerHTML = `
        <h3>${escapeHTML(title)}</h3>

        <p>
          ${stripHTML(item.snippet)}...
        </p>

        <button onclick="openViewer('${url}')">
          Open Article
        </button>

        <button onclick="favorite('${escapeHTML(title)}','${url}')">
          ⭐ Save
        </button>
      `;

      results.appendChild(div);

    });

  } catch (error) {

    results.innerHTML =
      '<div class="empty">Wikipedia search could not be loaded.</div>';

  }

}


/* QUICK SEARCH */

function searchEngine(type) {

  engine.value = type;

  if (type === "duck") {
    searchInput.placeholder = "Search DuckDuckGo...";
  } else {
    searchInput.placeholder = "Search Wikipedia...";
  }

  searchInput.focus();
}


/* VIEWER */

function openViewer(url) {

  viewer.style.display = "flex";

  viewerFrame.src = url;

  viewerUrl.textContent = url;

}

function closeViewer() {

  viewer.style.display = "none";

  viewerFrame.src = "about:blank";

}

function reloadViewer() {

  viewerFrame.contentWindow.location.reload();

}

function goBack() {

  try {
    viewerFrame.contentWindow.history.back();
  } catch(e) {}

}

function goForward() {

  try {
    viewerFrame.contentWindow.history.forward();
  } catch(e) {}

}


/* HISTORY */

function saveHistory(item) {

  historyData.unshift({
    text: item,
    time: new Date().toLocaleString()
  });

  historyData =
    historyData.slice(0, 50);

  localStorage.setItem(
    "webHistory",
    JSON.stringify(historyData)
  );

}

function showHistory() {

  results.innerHTML = "<h2>🕘 History</h2>";

  if (!historyData.length) {

    results.innerHTML +=
      '<div class="empty">No history yet.</div>';

    return;
  }

  historyData.forEach(item => {

    results.innerHTML += `
      <div class="result">
        <h3>${escapeHTML(item.text)}</h3>
        <p>${escapeHTML(item.time)}</p>
      </div>
    `;

  });

}


/* FAVORITES */

function favorite(title, url) {

  favorites.push({
    title: title,
    url: url
  });

  localStorage.setItem(
    "webFavorites",
    JSON.stringify(favorites)
  );

  alert("Saved to favorites!");

}

function showFavorites() {

  results.innerHTML = "<h2>⭐ Favorites</h2>";

  if (!favorites.length) {

    results.innerHTML +=
      '<div class="empty">No favorites yet.</div>';

    return;
  }

  favorites.forEach(item => {

    results.innerHTML += `
      <div class="result">
        <h3>${escapeHTML(item.title)}</h3>
        <button onclick="openViewer('${item.url}')">
          Open
        </button>
      </div>
    `;

  });

}


/* HOME */

function home() {

  results.innerHTML = "";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* CLEAR DATA */

function clearData() {

  if (!confirm("Clear history and favorites?")) return;

  localStorage.removeItem("webHistory");
  localStorage.removeItem("webFavorites");

  historyData = [];
  favorites = [];

  results.innerHTML =
    '<div class="empty">Data cleared.</div>';

}


/* HELPERS */

function stripHTML(text) {

  const div = document.createElement("div");

  div.innerHTML = text;

  return div.textContent || div.innerText || "";

}

function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
  </html>
